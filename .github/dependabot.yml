# matchory supply chain baseline:
# https://github.com/matchory/.github/blob/main/supply-chain/STANDARD.md
version: 2

updates:
  # Updates the `uses:` pins in the root action.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, github-actions]
